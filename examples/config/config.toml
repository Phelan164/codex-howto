# Conservative project defaults. Verify keys against the current official
# configuration reference before adopting this file.

sandbox_mode = "workspace-write"
approval_policy = "on-request"

[sandbox_workspace_write]
network_access = false

[agents]
enabled = true
max_concurrent_threads_per_session = 4

