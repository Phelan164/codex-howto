routing:
  enabled: true
  scope: subagents
  preserve_explicit_model: true

  tiers:
    easy:
      model: gpt-5.6-sol
      reasoning_effort: medium
    medium:
      model: gpt-6-astra
      reasoning_effort: low
    difficult:
      model: gpt-6-astra
      reasoning_effort: high

  policy:
    uncertain_tier: inherit
    reviewer_minimum_tier: medium
    max_escalations_per_task: 1
    unavailable_model: inherit
    log_decisions: true
