name: Validate

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  repository:
    name: Repository and playground
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Configure trusted Living Wiki history
        run: >-
          git config --local --add codex.wikiTrustedRef
          refs/remotes/origin/main

      - name: Validate guide structure and local links
        run: python3 scripts/validate_repo.py

      - name: Validate the living wiki
        run: python3 skills/maintain-codex-wiki/scripts/wiki_lint.py .

      - name: Run playground tests
        run: >-
          python3 -m unittest discover
          -s labs/engineering-playground/backend
          -p "test_*.py"

      - name: Run measurement utility tests
        run: >-
          python3 -m unittest discover
          -s scripts/tests
          -p "test_*.py"

      - name: Validate the measurement template
        run: >-
          python3 scripts/summarize_engineering_loop.py
          examples/measurements/engineering-loop-runs.csv

      - name: Compile Python examples
        run: >-
          python3 -m compileall -q
          scripts
          labs/engineering-playground/backend
          labs/incident-response-benchmark
