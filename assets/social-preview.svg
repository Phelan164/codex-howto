        <path d="M163 36l-10-7v14z"/>
        <path d="M331 36l-10-7v14z"/>
        <path d="M499 36l-10-7v14z"/>
        <path d="M667 36l-10-7v14z"/>
        <path d="M835 36l-10-7v14z"/>
