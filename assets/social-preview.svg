    <text x="72" y="518" fill="#9fb2c7" font-size="23">13 modules · 9 focused skills · one measurable engineering loop</text>
    <text x="72" y="578" fill="#f3f8fc" font-size="22" font-weight="650">github.com/Phelan164/codex-howto</text>
    <text x="1208" y="578" fill="#7fdcc5" font-size="22" font-weight="700" text-anchor="end">Learn → Run → Measure → Adapt</text>
